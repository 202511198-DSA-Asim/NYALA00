<text x="40" y="950" class="label">PK primary key   •   FK foreign key   •   UQ unique   •   ID identity   •   ? nullable (all other columns required)</text><text x="40" y="984" class="subtitle">Each child references one parent. A parent can have zero or more children. All foreign keys use ON DELETE RESTRICT.</text><text x="40" y="1015" class="subtitle">Tariff dates are inclusive. No overlap for the same goods + origin + destination. Agreements do not calculate tariff discounts.</text><text x="40" y="1046" class="subtitle">SQL files 01–04 define the complete checks and exclusion constraint. This diagram does not alter the database.</text></svg>